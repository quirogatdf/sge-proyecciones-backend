# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Laravel 13, PHP ^8.4 (runtime 8.5.1), PostgreSQL, Sanctum 4.3, maatwebsite/excel 4.0
  Architecture: Standard Laravel MVC + Eloquent; Form Requests, Resources, Policies, Enums
  Testing: PHPUnit 12.5.23 (NOT Pest) with Unit and Feature suites
  Style: Laravel Pint 1.29.1
  Artifact language: Spanish. Spec style: REQ-{TAG}-{N} + SCENARIO-N (Given/When/Then)

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: true
  detected: "Mon Oct 05 2026 (re-verified; supersedes the Apr 29 2026 detection)"
  runner:
    command: "composer test"
    command_expanded: "php artisan config:clear && php artisan test"
    command_direct: "./vendor/bin/phpunit --no-coverage"
    framework: "PHPUnit 12.5.23"
    pest_installed: false
    suites:
      unit: "php artisan test --testsuite=Unit"
      feature: "php artisan test --testsuite=Feature"
    single_file: "./vendor/bin/phpunit tests/Feature/ProyeccionInstrumentoApiTest.php"
  layers:
    unit:
      available: true
      tool: "PHPUnit"
      location: "tests/Unit (Enums, Models, Policies, Requests, Resources, Services, Migration)"
    integration:
      available: true
      tool: "Laravel Tests\\TestCase"
      location: "tests/Feature (API, Authorization, Migration)"
    e2e:
      available: false
      tool: null
      note: "Not installed; E2E lives in the frontend via Playwright."
  database_in_tests:
    engine: "sqlite"
    dsn: ":memory:"
    note: >-
      phpunit.xml overrides DB_CONNECTION=sqlite and DB_DATABASE=:memory: while local/dev data is
      PostgreSQL. Any raw SQL, ILIKE, ON CONFLICT, JSON operators, full-text search or other
      Postgres-specific constructs added for search/filtering MUST be sqlite-compatible or the suite
      breaks. Prefer the query builder / Eloquent so both engines agree.
  baseline:
    date: "2026-10-05"
    status: green
    tests_passed: 149
    tests_total: 149
    assertions: 476
    duration: "~3.3s"
    note: "Green baseline. Any failure after this point is a regression from the active change."
  coverage:
    available: false
    command: null
    note: "No Xdebug or PCOV extension installed, so `php artisan test --coverage` cannot run."
  quality:
    lint: { available: true, command: "./vendor/bin/pint" }
    format: { available: true, command: "./vendor/bin/pint" }
    format_check: { available: true, command: "./vendor/bin/pint --test" }
    typecheck: { available: false, command: null, note: "No PHPStan or Psalm installed." }
