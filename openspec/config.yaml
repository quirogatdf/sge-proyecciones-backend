# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Laravel 13 with PHP 8.3
  Architecture: Standard Laravel MVC with Eloquent ORM
  Testing: PHPUnit with Unit and Feature test suites
  Style: Laravel Pint available for code formatting

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  ## Testing Capabilities
  **Strict TDD Mode**: enabled
  **Detected**: Mon Apr 27 2026

  ### Test Runner
  - Command: `php artisan test` or `vendor/bin/phpunit`
  - Framework: PHPUnit

  ### Test Layers
  | Layer | Available | Tool |
  |-------|-----------|------|
  | Unit | ✅ | PHPUnit |
  | Integration | ✅ | PHPUnit (Feature tests) |
  | E2E | ❌ | Not installed |

  ### Coverage
  - Available: ✅
  - Command: `php artisan test --coverage` or `vendor/bin/phpunit --coverage-html coverage`

  ### Quality Tools
  | Tool | Available | Command |
  |------|-----------|---------|
  | Linter | ✅ | PHPStan (if installed) or Laravel Pint for basic checks |
  | Type checker | ❌ | PHPStan would be needed for strict type checking |
  | Formatter | ✅ | `vendor/bin/pint`